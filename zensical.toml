[project]
site_url = "https://www.example.com/"
site_name = "C365"
# site_description = "Your project description"
# site_author = "Your name"

# copyright = "Copyright &copy; 2026 Your name"

repo_url = "https://github.com/hayamahamed/c365"
repo_name = "hayamahamed/c365"
edit_uri = "https://github.com/hayamahamed/c365/main/docs/"


nav = [

    { "Home" = "index.md" },
    { "General" =  [
        { "Linux Containers" = "containers.md" },
        { "Docker & Podman" = "docker-podman.md" },
    ]},
    { " Work With Containers" = [
        {
        "Podman Containers" = [
            { "Podman Basics" = "podman.md" },
        ]},
    ]},
    { "Containers Architecture" =  [
        { "Architecture" = "architecture.md" },

    ]},
]

extra_css = [
  "stylesheets/extra.css",
]

# extra_css = ["stylesheets/extra.css"]
# extra_javascript = ["javascripts/extra.js"]



# variant = "classic"
# custom_dir = "overrides"
# favicon = "images/favicon.png"
language = "en"
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",

  "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  # "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]


# logo = "assets/logo.png"

[project.theme.icon]
logo = "lucide/file-box"
view = "simple/github"
repo = "fontawesome/brands/github"



# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"
[project.theme]
custom_dir = "overrides"
favicon = "img/c365.svg"
features = [
  "content.action.edit", # Edit this page
  "content.action.view", # View source of this page
  "navigation.footer",
  "content.code.copy",
  "navigation.path",
  "navigation.instant",
  "navigation.tabs",
 "navigation.tabs.sticky",
 "navigation.sections",
]
[project.theme.icon.admonition]
tip = "octicons/ai-model-16"


[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/monitor"
toggle.name = "System Preference"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Light Mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Dark Mode"

# [[project.extra.social]]
# icon = "fontawesome/brands/github"
# link = "https://github.com/user/repo"

# [[project.extra.social]]
# icon = "fontawesome/brands/mastodon"
# link = "https://fosstodon.org/@user"

[project.markdown_extensions]
tables = {}
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = false
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
toc.toc_depth = 5

[project.extra]
generator = false

[project.extra.consent]
title = "Notice"
description = """
All product names, logos, and their other branding or marketing aspects are property of their respective owners or entities. They are used here for identification and educational purposes only.
Unless specified otherwise, we do not claim endorsement or affiliation with anyone. Click accept to proceed else you can simply close this page
"""
actions = [
  "accept",
]

[project.extra.consent.cookies]
github.name = ""
